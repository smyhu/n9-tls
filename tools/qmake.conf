# n9-tls: cross build for Nokia N9 (Harmattan PR1.3) using bin/n9-gcc / n9-g++ wrappers
MAKEFILE_GENERATOR      = UNIX
TARGET_PLATFORM         = unix
TEMPLATE                = app
CONFIG                 += qt warn_on release incremental link_prl nostrip
QT                     += core gui
QMAKE_INCREMENTAL_STYLE = sublib
include(../common/g++.conf)
include(../common/linux.conf)
QMAKE_CC                = n9-gcc
QMAKE_CXX               = n9-g++
QMAKE_LINK              = n9-g++
QMAKE_LINK_SHLIB        = n9-g++
QMAKE_LINK_C            = n9-gcc
QMAKE_LINK_C_SHLIB      = n9-gcc
QMAKE_AR                = n9-ar cqs
QMAKE_OBJCOPY           = arm-linux-gnueabihf-objcopy
QMAKE_STRIP             = n9-strip
QMAKE_CFLAGS_RELEASE    = -O2 -g -Wno-psabi
QMAKE_CXXFLAGS_RELEASE  = -O2 -g -Wno-psabi
QMAKE_INCDIR_X11        =
QMAKE_LIBDIR_X11        =
QMAKE_INCDIR_OPENGL     =
QMAKE_LIBDIR_OPENGL     =
load(qt_config)
